<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Roadmap 2026-27</title>
    <link rel="stylesheet" href="../styles/paper.css">
    <link rel="stylesheet" href="../styles/markdown.css">
</head>
<body>
    <div class="container">
        <header>
            <a class="back-link" href="../index.html">← Back to Topics</a>
            <h1>Complete Python Roadmap 2026-27</h1>
            <p class="subtitle">Your Ultimate Learning Resource Guide</p>
        </header>

        <section class="main-content">
            <article id="roadmap-content" class="markdown-body">
                <p>Loading roadmap notes...</p>
            </article>

            <div class="download-wrapper">
                <a id="roadmap-pdf" class="download-button disabled" data-pdf="13f8949c-d4cd-4f43-a8c7-50da884e46a2_Python_Roadmap_2026-27_-_Complete_Resource_Guide.pdf" href="#" download>
                    📥 Download Roadmap PDF
                </a>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
    async function renderRoadmap() {
        const contentElement = document.getElementById('roadmap-content');
        try {
            const response = await fetch('README.md');
            if (!response.ok) {
                throw new Error('README not found');
            }
            const markdown = await response.text();
            contentElement.innerHTML = marked.parse(markdown);
        } catch (error) {
            console.warn('Unable to load README.md:', error.message);
            contentElement.innerHTML = '<div class="missing-message">Add your <strong>README.md</strong> here to see the roadmap rendered in place.</div>';
        }
    }

    async function setupDownloadButton() {
    const downloadLink = document.getElementById('roadmap-pdf');
        const pdfPath = downloadLink.dataset.pdf || downloadLink.getAttribute('href');

        if (!pdfPath || pdfPath === '#') {
            downloadLink.classList.add('disabled');
            return;
        }

        downloadLink.href = pdfPath;

        try {
            const response = await fetch(pdfPath, { method: 'HEAD' });
            if (!response.ok) {
                throw new Error('PDF missing');
            }
            downloadLink.classList.remove('disabled');
        } catch (error) {
            downloadLink.classList.add('disabled');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderRoadmap();
        setupDownloadButton();
    });
    </script>
</body>
</html>
